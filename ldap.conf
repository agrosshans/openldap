# LDAP Defaults
#

# See ldap.conf(5) for details
# This file should be world readable but not world writable.

BASE    dc=lanathome,dc=org 
URI     ldaps://ldap.lanathome.org:6360                                    

#SIZELIMIT      12
#TIMELIMIT      15
#DEREF          never

TLS_CACERT /usr/local/share/ca-certificates/lanathome.org-root.crt                                                                      
TLS_REQCERT demand